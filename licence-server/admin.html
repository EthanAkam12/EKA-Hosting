<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Licences · EKA</title>
<style>
  :root { --brand: #4f46e5; --line: #e3e6eb; --muted: #6b7385; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c2230; background: #f5f6f8; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 24px; } h2 { margin: 0 0 8px; font-size: 17px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
  input, textarea { font: inherit; padding: 7px 10px; border: 1px solid #cfd4dc; border-radius: 6px; width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid #cfd4dc; background: #fff; cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .lic { border-top: 1px solid var(--line); padding: 14px 0; }
  .lic:first-child { border-top: 0; }
  .key { font: 600 15px ui-monospace, Menlo, Consolas, monospace; user-select: all; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: #e7f6ec; color: #15803d; }
  .badge.off { background: #fdecec; color: #b91c1c; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<main>
  <div><h1>EKA licences</h1><p class="muted" style="margin:4px 0 0">Make a key for each host that buys EKA Builder. Their builder checks it twice a day.</p></div>

  <section class="panel">
    <h2>New licence</h2>
    <form id="new" class="grid">
      <label>Host (company)<input name="name" required></label>
      <label>Contact email<input name="email" type="email"></label>
      <label>Servers allowed<input name="servers" type="number" min="1" value="1"></label>
      <label>Expires (empty = never)<input name="expires" type="date"></label>
      <label style="grid-column:1/-1">Notes (only you see these)<input name="notes"></label>
      <div><button class="primary">Make licence key</button></div>
    </form>
  </section>

  <section class="panel">
    <h2>Licences</h2>
    <div id="list" class="muted">Loading…</div>
  </section>

  <section class="panel">
    <h2>Announce an update</h2>
    <p class="small muted" style="margin-top:0">Every builder's administrator sees "update available" when their version is older than this.</p>
    <form id="latest" class="grid">
      <label>Version (e.g. 0.2.0)<input name="version" pattern="\d+\.\d+\.\d+"></label>
      <label>Download / instructions link<input name="url" type="url"></label>
      <label style="grid-column:1/-1">What's new<textarea name="notes" rows="3"></textarea></label>
      <div><button class="primary">Save</button></div>
    </form>
  </section>
</main>
<script>
const call = async (method, url, body) => {
  const res = await fetch("/admin/api" + url, { method, headers: { "Content-Type": "application/json", "X-Requested-With": "eka" }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Failed");
  return data;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ago = (iso) => { if (!iso) return "never"; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

async function load() {
  const db = await call("GET", "/licences");
  const list = document.getElementById("list");
  list.classList.toggle("muted", !db.licences.length);
  list.innerHTML = db.licences.length ? db.licences.slice().reverse().map((l) => `
    <div class="lic">
      <div class="row"><strong>${esc(l.name)}</strong> <span class="badge ${l.revoked || (l.expires && l.expires < new Date().toISOString().slice(0, 10)) ? "off" : ""}">${l.revoked ? "Cancelled" : l.expires && l.expires < new Date().toISOString().slice(0, 10) ? "Expired" : "Active"}</span>
        <span class="small muted">${esc(l.email)} · ${(l.activations || []).length} of ${l.servers} server(s) · ${l.expires ? `expires ${esc(l.expires)}` : "no expiry"}</span></div>
      <div class="key">${esc(l.key)}</div>
      ${l.notes ? `<div class="small muted">${esc(l.notes)}</div>` : ""}
      ${(l.activations || []).length ? `<table><tr><th>Server</th><th>Version</th><th>Websites</th><th>Customers</th><th>Last check</th><th></th></tr>${l.activations.map((a) => `<tr><td>${esc(a.hostname || a.serverId.slice(0, 8))}</td><td>${esc(a.version)}</td><td>${a.sites}</td><td>${a.customers}</td><td>${ago(a.lastSeen)}</td><td><button data-key="${esc(l.key)}" data-remove="${esc(a.serverId)}" title="Free this slot, e.g. when they move to a new server">Remove</button></td></tr>`).join("")}</table>` : `<div class="small muted">Not used on any server yet.</div>`}
      <div class="row" style="margin-top:8px">
        <button data-key="${esc(l.key)}" data-servers="${l.servers}">Servers allowed…</button>
        <button data-key="${esc(l.key)}" data-expires="${esc(l.expires || "")}">Expiry…</button>
        <button data-key="${esc(l.key)}" data-revoke="${l.revoked ? "0" : "1"}">${l.revoked ? "Re-activate" : "Cancel licence"}</button>
      </div>
    </div>`).join("") : "No licences yet.";
  const f = document.getElementById("latest");
  if (db.latest) { f.version.value = db.latest.version; f.url.value = db.latest.url || ""; f.notes.value = db.latest.notes || ""; }
}

document.getElementById("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-key]");
  if (!b) return;
  const key = b.dataset.key;
  try {
    if (b.dataset.remove) { if (confirm("Free this server's slot? If it's still running, it'll take the slot back at its next check, if one is free.")) await call("PATCH", `/licences/${key}`, { removeServer: b.dataset.remove }); }
    else if (b.dataset.servers) { const n = prompt("How many servers may use this key?", b.dataset.servers); if (n) await call("PATCH", `/licences/${key}`, { servers: Number(n) }); }
    else if ("expires" in b.dataset) { const d = prompt("Expiry date (YYYY-MM-DD), or empty for none:", b.dataset.expires); if (d !== null) await call("PATCH", `/licences/${key}`, { expires: d.trim() }); }
    else if (b.dataset.revoke) { if (b.dataset.revoke === "0" || confirm("Cancel this licence? Their builder stops making new websites and AI within 12 hours. Websites already published stay online.")) await call("PATCH", `/licences/${key}`, { revoked: b.dataset.revoke === "1" }); }
    load();
  } catch (err) { alert(err.message); }
});

document.getElementById("new").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const { licence } = await call("POST", "/licences", { name: f.name.value, email: f.email.value, servers: f.servers.value, expires: f.expires.value, notes: f.notes.value });
    f.reset();
    alert(`Licence key for ${licence.name}:\n\n${licence.key}\n\nThey put it in the builder's Customers page (Licence), or LICENCE_KEY= in settings.txt.`);
    load();
  } catch (err) { alert(err.message); }
});

document.getElementById("latest").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try { await call("PUT", "/latest", { version: f.version.value, url: f.url.value, notes: f.notes.value }); alert("Saved."); } catch (err) { alert(err.message); }
});

load().catch((err) => { document.getElementById("list").textContent = err.message; });
</script>
</body>
</html>
