<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='21' font-size='11' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3EEKA%3C/text%3E%3C/svg%3E">
<title>Websites · EKA Hosting</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
<style>
  .top { background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-in, .main { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .top-in { display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-right: auto; }
  .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 800; font-size: 12px; }
  .main { padding-top: 28px; padding-bottom: 60px; }
  .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .thumb { height: 150px; background: linear-gradient(135deg, var(--c1, #e0e7ff), var(--c2, #f5f6f8)); position: relative; display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--line); text-decoration: none; }
  .thumb iframe { position: absolute; top: 0; left: 0; width: 400%; height: 400%; border: 0; transform: scale(.25); transform-origin: 0 0; pointer-events: none; background: #fff; }
  .thumb-name { font-weight: 700; font-size: 18px; color: rgba(0,0,0,.55); padding: 0 16px; text-align: center; }
  .card-body { padding: 14px 16px; display: grid; gap: 6px; }
  .card-title { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .card-title h2 { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-actions { display: flex; gap: 6px; padding: 0 16px 14px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 70px 20px; background: var(--panel); border: 1px dashed var(--line-strong); border-radius: 12px; }
  .empty h2 { font-size: 18px; margin-bottom: 6px; }
  .progress { display: flex; align-items: center; gap: 8px; color: var(--brand); font-weight: 600; font-size: 13px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--line-strong); background: #fff; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; bottom: calc(100% + 4px); background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 4px; min-width: 160px; z-index: 5; }
  .menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .menu-list button:hover { background: #f2f3f6; }
  #notice { margin-bottom: 18px; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="brand-mark">EKA</span> EKA Hosting</div>
  <a class="btn btn-ghost" href="/help" target="_blank" rel="noopener" style="margin-left:auto">Help</a>
  <a class="btn btn-ghost" href="/support" target="_blank" rel="noopener">Support</a>
  <button class="btn btn-ghost" id="logout">Log out</button>
</div></header>
<main class="main">
  <div class="head">
    <div><h1>Websites</h1><p class="muted" style="margin:4px 0 0">Create, edit and publish your customers' sites.</p></div>
    <div class="row"><button class="btn" id="usage" hidden>AI usage</button>
    <button class="btn btn-primary" id="new">+ New website</button></div>
  </div>
  <div id="notice"></div>
  <div id="list"></div>
</main>
<script type="module" src="/admin/assets/dashboard.js"></script>
</body>
</html>
