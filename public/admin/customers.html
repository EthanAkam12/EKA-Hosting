<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='21' font-size='11' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3EEKA%3C/text%3E%3C/svg%3E">
<title>Customers · EKA Hosting</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
<style>
  .top { background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-in, .main { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .top-in { display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-right: auto; text-decoration: none; color: inherit; }
  .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 800; font-size: 12px; }
  .main { padding-top: 28px; padding-bottom: 60px; display: grid; gap: 22px; }
  .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; }
  .panel h2 { font-size: 17px; margin: 0 0 4px; }
  .scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table.list { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
  table.list th, table.list td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.list th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  table.list tr.off td { opacity: .55; }
  table.list .select, table.list .input { min-height: 30px; padding: 4px 8px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .bar { height: 6px; width: 90px; background: #eef0f6; border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar span { display: block; height: 100%; background: var(--brand); }
  .pw { font: 600 16px/1.4 ui-monospace, Menlo, Consolas, monospace; background: #f4f5f8; padding: 10px 12px; border-radius: 8px; user-select: all; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/admin"><span class="brand-mark">EKA</span> EKA Hosting</a>
  <a class="btn btn-ghost" href="/admin">Websites</a>
  <a class="btn btn-ghost" href="/help#customers" target="_blank" rel="noopener">Help</a>
  <button class="btn btn-ghost" id="logout">Log out</button>
</div></header>
<main class="main" id="app"></main>
<script type="module" src="/admin/assets/customers.js"></script>
</body>
</html>
