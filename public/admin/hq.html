<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='21' font-size='11' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3EEKA%3C/text%3E%3C/svg%3E">
<title>HQ · EKA Hosting</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
<style>
  .top { background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-in, .main { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .top-in { display: flex; align-items: center; gap: 4px 12px; min-height: 60px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
  @media (max-width: 560px) { .top-in .btn { padding-left: 8px; padding-right: 8px; } .brand { flex-basis: 100%; } }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-right: auto; text-decoration: none; color: inherit; }
  .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 800; font-size: 12px; }
  .main { padding-top: 24px; padding-bottom: 60px; }
  .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; margin-bottom: 10px; }

  /* The pixel office */
  .office-wrap { padding: 0; overflow: hidden; background: #2b2540; }
  .office { display: block; width: 100%; height: auto; image-rendering: pixelated; shape-rendering: crispEdges; }
  .office .desk { cursor: pointer; }
  .office .desk:focus { outline: none; }
  .office .desk:focus-visible .plate, .office .desk:hover .plate { fill: #fff7d6; }
  .office .desk.picked .plate { fill: #fde68a; }
  .office text { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
  .office .off .person { opacity: 0; }
  .office .off .screen { fill: #1f2937; }
  .office .working .person { animation: hq-bob .6s steps(2) infinite; }
  .office .working .screen { animation: hq-flicker 1.2s steps(3) infinite; }
  .office .bubble { animation: hq-float 1.6s steps(2) infinite; }
  .office .working .hands { animation: hq-type .3s steps(2) infinite; }
  @keyframes hq-bob { 50% { transform: translateY(-1px); } }
  @keyframes hq-float { 50% { transform: translateY(-2px); } }
  @keyframes hq-type { 50% { transform: translateY(1px); } }
  @keyframes hq-flicker { 0% { fill: #60a5fa; } 33% { fill: #93c5fd; } 66% { fill: #3b82f6; } }
  @media (prefers-reduced-motion: reduce) { .office * { animation: none !important; } }
  .office-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 16px; background: #1e1a2e; color: #e9e5ff; font-size: 13.5px; }
  .office-bar .grow { flex: 1; }
  .office-bar .btn { background: #3b3358; color: #fff; border-color: #4c4370; }

  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .task { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--brand)); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: #fff; }
  .task.alert { background: #fff7f5; }
  .task.failed { background: #fbf6f6; }
  .task-head { display: flex; gap: 10px; align-items: start; }
  .avatar { flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; background: var(--c); }
  .task-title { font-weight: 650; font-size: 14.5px; line-height: 1.35; }
  .task-meta { font-size: 12.5px; color: var(--muted); }
  .task-summary { font-size: 13.5px; margin: 6px 0 0; color: #343b4a; white-space: pre-wrap; }
  .task-draft { display: grid; gap: 8px; margin-top: 10px; }
  .task-draft .textarea { min-height: 150px; font-size: 13.5px; line-height: 1.5; }
  .task-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .task-links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; margin-top: 8px; }
  .empty-q { text-align: center; padding: 34px 16px; color: var(--muted); }
  .empty-q strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .agent-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .agent-row:last-child { border-bottom: 0; }
  .agent-row .who { flex: 1; min-width: 0; }
  .agent-row .who small { display: block; color: var(--muted); font-size: 12.5px; }
  .recent li { font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); list-style: none; }
  .recent { margin: 0; padding: 0; max-height: 360px; overflow: auto; }
  .form-grid { display: grid; gap: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/admin"><span class="brand-mark">EKA</span> EKA Hosting</a>
  <a class="btn btn-ghost" href="/admin">Websites</a>
  <a class="btn btn-ghost" href="/admin/customers">Customers</a>
  <a class="btn btn-ghost" href="/help#hq" target="_blank" rel="noopener">Help</a>
  <button class="btn btn-ghost" id="logout">Log out</button>
</div></header>
<main class="main" id="app"><p class="muted">Opening HQ…</p></main>
<script type="module" src="/admin/assets/hq.js"></script>
</body>
</html>
