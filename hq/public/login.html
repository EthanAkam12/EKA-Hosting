<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg">
<title>EKA HQ · Log in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1630; color: #f5f3ff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 24px 24px; }
  form { width: min(360px, 100%); background: #2b2540; border: 3px solid #0f0d1a; box-shadow: 6px 6px 0 #0f0d1a; padding: 26px; display: grid; gap: 14px; }
  h1 { font: 18px/1.4 "Press Start 2P", monospace; margin: 0 0 4px; color: #fde68a; }
  p { margin: 0; color: #c4bfe0; font-size: 14px; }
  input { font: inherit; padding: 11px 12px; border: 2px solid #0f0d1a; background: #f5f3ff; color: #1a1630; }
  button { font: 12px "Press Start 2P", monospace; padding: 14px; border: 2px solid #0f0d1a; background: #0f766e; color: #fff; cursor: pointer; box-shadow: 3px 3px 0 #0f0d1a; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0f0d1a; }
  .err { color: #fca5a5; min-height: 1.5em; }
</style>
</head>
<body>
<form id="f">
  <h1>EKA HQ</h1>
  <p>Henry and the team are waiting for you.</p>
  <label>Password<br><input type="password" name="password" autocomplete="current-password" required autofocus style="width:100%;box-sizing:border-box;margin-top:4px"></label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit">Come in</button>
</form>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: e.target.password.value }) });
    if (r.ok) location.href = "/"; else document.getElementById("err").textContent = (await r.json().catch(() => ({}))).error || "Couldn't log in.";
  });
</script>
</body>
</html>
